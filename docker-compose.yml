services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nwis
      POSTGRES_PASSWORD: nwis_demo_password
      POSTGRES_DB: nwis
    ports:
      - "5432:5432"
    volumes:
      - nwis_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwis -d nwis"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://nwis:nwis_demo_password@db:5432/nwis
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-to-a-long-random-string-for-demo-only
      API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      UPLOAD_DIR: /app/uploads
      ENABLE_ML_MODEL: "true"
      DEMO_AUTH: "true"
    ports:
      - "8000:8000"
    volumes:
      - nwis_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
        NEXT_PUBLIC_DEMO_AUTH: "true"
        NEXT_PUBLIC_MAP_CENTER_LAT: "27.4720"
        NEXT_PUBLIC_MAP_CENTER_LON: "95.3180"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  nwis_pg:
  nwis_uploads:
